version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      astro: # Astro core and its official integrations update together
        patterns:
          - "astro"
          - "@astrojs/*"
      fonts:
        patterns:
          - "@fontsource/*"
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
