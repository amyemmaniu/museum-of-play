name: filter
description: |-
  Filters the collection items using space-separated `field:value` pairs.
  Any field listed for the `sort` parameter on the same endpoint can be used as a filter.

  **Format:** `field1:value1 field2:value2`

  **Supported operators:**
  - `field:value` - exact match
  - `field:value1,value2` - match any of the comma-separated values (OR)

  **Examples:**
  - `nationality:Canadian` - artists of a single nationality
  - `nationality:Canadian,American` - artists of either nationality
  - `artist_id:ART-JST-0001` - artworks by a specific artist
  - `creation_year:2021` - artworks created in a specific year
  - `type:solo location:Gallery 1` - combine multiple filters
in: query
required: false
schema:
  type: string
