name: search
in: query
description: |-
  Performs a case-insensitive text search across relevant fields in the collection.

  **Fields searched depend on the endpoint:**
  - **Artists:** `artist_id`, `artist_name`, `gender`, `nationality`, `based_in_place`
  - **Artworks:** `accession_number`, `medium`, `title`, `artist_id`, `dimensions`
  - **Exhibitions:** `exhibition_id`, `exhibition_name`, `curator`, `type`, `location`

  Returns items where any of the searchable fields contain the search term as a substring.
required: false
schema:
  type: string
