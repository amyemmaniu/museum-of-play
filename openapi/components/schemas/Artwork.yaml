type: object
description: An artwork in the collection.
properties:
  accession_number:
    type: string
    description: Internal unique identifier.
    pattern: ^[0-9]{4}\.[0-9]{4}$
    example: '2021.0001'
  title:
    type: string
    description: The title of the artwork.
  artist_id:
    type: string
    description: ID of the artist who created the work.
    pattern: ^ART-[A-Z]{3}-[0-9]{4}$
    example: ART-JST-0001
  medium:
    type: string
    description: The medium in which the artwork was created.
  dimensions:
    type: string
    description: The dimensions of the artwork in centimeters, formatted as length x width.
    example: '240 x 360'
  creation_year:
    type: integer
    format: int32
    description: The year in which the artwork was created.
  runtime:
    type:
      - string
      - 'null'
    description: Runtime for videos and live performance art, formatted as HH:MM:SS.
    pattern: ^([0-1][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])$
    example: '01:30:00'
