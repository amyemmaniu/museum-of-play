type: object
description: An exhibition at the museum.
properties:
  exhibition_id:
    type: string
    description: Internal unique identifier.
    pattern: ^EXH-[0-9]{4}$
    example: EXH-0001
  exhibition_name:
    type: string
    description: The name of the exhibition.
  curator:
    type: string
    description: The curator of the exhibition.
  type:
    type: string
    description: Type of exhibition, such as solo, retrospective, or group.
  location:
    type: string
    description: The location at which the exhibition occurred.
  start_date:
    type: string
    format: date
    description: The date the exhibition opened.
  end_date:
    type: string
    format: date
    description: The date the exhibition closed.
