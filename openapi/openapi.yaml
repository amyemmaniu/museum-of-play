openapi: 3.1.0
info:
  title: Museum of Play Collections API
  description: |
    A REST API for accessing and managing the Museum of Play's collections, including exhibitions and artwork metadata.
    This API allows developers to integrate with the museum's systems for various applications.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000
    description: Local development server for the Museum of Play Collections API.
tags:
  - name: Authorization
    description: Create a client to demo the API.
  - name: Artists
    description: Operations related to artists.
  - name: Artworks
    description: Operations related to artworks.
  - name: Exhibitions
    description: Exhibition management operations, including the artists and artworks featured in each exhibition.
paths:
  /oauth2/register:
    $ref: paths/oauth2_register.yaml
  /artists:
    $ref: paths/artists.yaml
  /artists/{artist_id}:
    $ref: paths/artists_{artist_id}.yaml
  /artworks:
    $ref: paths/artworks.yaml
  /artworks/{accession_number}:
    $ref: paths/artworks_{accession_number}.yaml
  /exhibitions:
    $ref: paths/exhibitions.yaml
  /exhibitions/{exhibition_id}:
    $ref: paths/exhibitions_{exhibition_id}.yaml
  /exhibitions/{exhibition_id}/artists:
    $ref: paths/exhibitions_{exhibition_id}_artists.yaml
  /exhibitions/{exhibition_id}/artists/{artist_id}:
    $ref: paths/exhibitions_{exhibition_id}_artists_{artist_id}.yaml
  /exhibitions/{exhibition_id}/artworks:
    $ref: paths/exhibitions_{exhibition_id}_artworks.yaml
  /exhibitions/{exhibition_id}/artworks/{accession_number}:
    $ref: paths/exhibitions_{exhibition_id}_artworks_{accession_number}.yaml
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 authorization for API access.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:3000/oauth2/authorize
          tokenUrl: http://localhost:3000/oauth2/token
          scopes:
            artworks:read: Read access to collections items.
            artworks:write: Write access to collections items (create, update, delete).
            artists:read: Read access to artists.
            artists:write: Write access to artists (create, update, delete).
            exhibitions:read: Read access to exhibitions.
            exhibitions:write: Write access to exhibitions and their featured artists and artworks.
        clientCredentials:
          tokenUrl: http://localhost:3000/oauth2/token
          scopes:
            artworks:read: Read access to collections items.
            artworks:write: Write access to collections items (create, update, delete).
            artists:read: Read access to artists.
            artists:write: Write access to artists (create, update, delete).
            exhibitions:read: Read access to exhibitions.
            exhibitions:write: Write access to exhibitions and their featured artists and artworks.
