parameters:
  - $ref: ../components/parameters/ExhibitionId.yaml
  - $ref: ../components/parameters/ArtistId.yaml
put:
  tags:
    - Exhibitions
  summary: Add an artist to an exhibition
  description: |
    Feature an existing artist in an exhibition.
    This operation is idempotent; adding an artist who is already featured has no effect.
  operationId: addExhibitionArtist
  security:
    - OAuth2:
        - exhibitions:write
  responses:
    '204':
      description: Artist added to the exhibition.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
delete:
  tags:
    - Exhibitions
  summary: Remove an artist from an exhibition
  description: Remove a featured artist from an exhibition. The artist record itself is not deleted.
  operationId: removeExhibitionArtist
  security:
    - OAuth2:
        - exhibitions:write
  responses:
    '204':
      description: Artist removed from the exhibition.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
