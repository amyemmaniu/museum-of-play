get:
  tags:
    - Exhibitions
  summary: List all exhibitions
  description: Retrieve a collection of exhibitions with optional filtering and pagination.
  operationId: listExhibitions
  security: []
  parameters:
    - $ref: ../components/parameters/After.yaml
    - $ref: ../components/parameters/Before.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Filter.yaml
    - $ref: ../components/parameters/Search.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    '200':
      description: Successful operation.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExhibitionList.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
post:
  tags:
    - Exhibitions
  summary: Add an exhibition
  description: Add an exhibition to the collections.
  operationId: addExhibition
  security:
    - OAuth2:
        - exhibitions:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Exhibition.yaml
        # TODO: add a request example once Exhibition.yaml fields are defined.
  responses:
    '201':
      description: Exhibition created successfully.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Exhibition.yaml
          examples:
            ExhibitionResponse:
              value:
                exhibition_id: EXH-0001
                exhibition_name: 'Julia St-Croix: Blue Hour'
                curator: Alex Morgan
                type: solo
                location: Gallery 1
                start_date: '2026-03-01'
                end_date: '2026-06-30'
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
